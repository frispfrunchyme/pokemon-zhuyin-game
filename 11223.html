<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>幼兒寶可夢注音 A4 列印學習單</title>
<style>
*{box-sizing:border-box}
:root{--ink:#263f5b;--muted:#6f8195;--blue:#9fd4f5;--bluebg:#f1faff;--yellow:#ffe07a;--pink:#ffabc3;--green:#ccefd2;--paper:#fffdf7}
body{margin:0;background:#f3f7fb;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:1180px;margin:auto;padding:18px}
header{text-align:center;padding:8px 0 14px}
h1{font-size:clamp(26px,4vw,42px);margin:0 0 8px;font-weight:900}
.sub{font-size:16px;color:var(--muted);font-weight:700}
.panel{background:white;border:3px solid #d6e7f5;border-radius:20px;padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;box-shadow:0 8px 25px #56789512}
label{font-size:17px;font-weight:900}
input{width:92px;padding:11px;border:3px solid #c8ddec;border-radius:13px;font-size:18px;text-align:center}
button{border:0;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #00000012}
.random{background:var(--yellow)} .rep{background:var(--pink)} .print{background:var(--green)}
.note{text-align:center;margin:13px 0;color:#566b82;font-weight:800}
.sheet{background:white;padding:12px;border-radius:18px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{position:relative;min-width:0;background:var(--paper);border:2px dashed #8fc8ee;border-radius:17px;padding:11px;text-align:center;break-inside:avoid;box-shadow:0 5px 15px #4b719010}
.card:nth-child(4n+2){background:#f8fdff} .card:nth-child(4n+3){background:#fff9fc} .card:nth-child(4n){background:#f9fff8}
.no{font-size:12px;font-weight:900;color:#7d8ea0}
.poke-img{display:block;width:80%;height:125px;object-fit:contain;margin:2px auto}
.img-fallback{display:none;height:125px;align-items:center;justify-content:center;background:#f5f7fa;border-radius:10px;color:#8a98a8;font-size:13px;font-weight:800}
.name{font-size:20px;font-weight:900;margin:3px 0 8px}
.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:5px}
.chip{background:white;border:2px solid var(--blue);border-radius:9px;padding:4px 6px;font-size:14px;font-weight:900;white-space:nowrap}
.badge{position:absolute;right:7px;top:7px;width:42px;height:42px;border-radius:50%;background:#e6455d;color:#fff;display:grid;place-items:center;font-size:21px;font-weight:900}
.mode{grid-column:1/-1;text-align:center;background:#fff4c8;border:2px solid #f0d66e;border-radius:13px;padding:9px;font-weight:900}
.mode small{display:block;font-weight:700;color:#7c6a2a;margin-top:2px}
.footer{text-align:center;color:#7b8b9a;font-size:13px;margin:16px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.wrap{padding:10px}.panel{gap:8px}button{font-size:14px;padding:11px 12px}.grid{gap:9px}.card{padding:8px}.poke-img,.img-fallback{height:105px}.name{font-size:18px}.chip{font-size:13px;padding:3px 5px}}
@media print{
  @page{size:A4 portrait;margin:8mm}
  html,body{background:#fff}
  .wrap{max-width:none;padding:0}
  header{padding:0 0 3mm}
  h1{font-size:20pt;margin:0}
  .sub,.panel,.note,.footer{display:none!important}
  .sheet{padding:0;border-radius:0}
  .grid{grid-template-columns:repeat(4,1fr);gap:3.5mm}
  .card{padding:2.5mm;border-radius:4mm;box-shadow:none;border-width:1.2px}
  .no{font-size:8pt}
  .poke-img,.img-fallback{height:28mm}
  .name{font-size:12pt;margin:1mm 0 1.5mm}
  .chip{font-size:8pt;padding:1mm 1.2mm;border-width:1px}
  .badge{width:8mm;height:8mm;font-size:10pt;right:1.5mm;top:1.5mm}
  .mode{padding:2mm;font-size:11pt}
}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>🌟 幼兒寶可夢注音學習單</h1>
<div class="sub">選擇內容 → 產生卡片 → 按「列印 A4」即可印出</div>
</header>

<section class="panel">
<label for="maxNo">最高編號</label>
<input id="maxNo" type="number" min="12" max="500" value="200">
<button class="random" id="randomBtn">🎲 隨機 12 隻</button>
<button class="rep" id="repBtn">⭐ 37 音全覽</button>
<button class="print" id="printBtn">🖨️ 列印 A4</button>
</section>

<div class="note" id="status">目前是列印學習單模式。產生內容後即可列印。</div>

<section class="sheet">
<div class="grid" id="grid"></div>
</section>

<div class="footer">列印時控制面板與說明會自動隱藏，只留下學習卡；圖片使用 Pokémon 官方圖鑑圖片網址。</div>
</div>

function pad3(n){return String(n).padStart(3,"0")}
function imgUrl(n){return `https://assets.pokemon.com/assets/cms2/img/pokedex/full/${pad3(n)}.png`}

function getZhuyin(name){
  // 每一個空白分隔的項目 = 一個中文字的完整注音。
  // 例如：妙蛙種子 → ㄇㄧㄠˋ / ㄨㄚ / ㄓㄨㄥˇ / ㄗ˙
  return ZHUYIN[name] || Array.from(name).map(()=> "•").join(" ");
}

function makeChips(name){
  return getZhuyin(name).split(/\s+/).map(x=>`<span class="chip">[ ${x} ]</span>`).join("");
}

function makeCard(id,name,badge=""){
  return `<article class="card">
    ${badge?`<div class="badge">${badge}</div>`:""}
    <div class="no">No.${pad3(id)}</div>
    <img class="poke-img" src="${imgUrl(id)}" alt="${name}" loading="lazy"
      onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div class="img-fallback">🖼️ 圖片未載入<br>No.${pad3(id)}</div>
    <div class="name">${name}</div>
    <div class="chips">${makeChips(name)}</div>
  </article>`;
}

function random12(){
  let max=Number(document.getElementById("maxNo").value)||200;
  max=Math.max(12,Math.min(500,max));
  document.getElementById("maxNo").value=max;
  const a=Array.from({length:max},(_,i)=>i+1);
  for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  const ids=a.slice(0,12);
  document.getElementById("grid").innerHTML=ids.map(id=>makeCard(id,NAMES[id-1])).join("");
  document.getElementById("status").textContent=`🎲 已產生 No.1～No.${max} 中的不重複 12 隻；現在可以直接列印。`;
}

function all37(){
  document.getElementById("grid").innerHTML =
    `<div class="mode">⭐ 37 音代表寶可夢全覽<small>右上角紅色圓章就是要練習的注音</small></div>` +
    REPRESENTATIVES.map(x=>makeCard(x.id,x.name,x.symbol)).join("");
  document.getElementById("status").textContent="⭐ 已產生 37 音全覽學習單；現在可以直接列印。";
}
