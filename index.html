*{box-sizing:border-box}

html,body{margin:0;padding:0}
body{background:#f3f7fb;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:1180px;margin:auto;padding:18px}
header{text-align:center;padding:8px 0 14px}

.sub{font-size:16px;color:var(--muted);font-weight:700}
.panel{background:#fff;border:3px solid #d6e7f5;border-radius:20px;padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;box-shadow:0 8px 25px #56789512}
label{font-size:17px;font-weight:900}
input{width:92px;padding:11px;border:3px solid #c8ddec;border-radius:13px;font-size:18px;text-align:center}
button{border:0;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #00000012}
.random{background:var(--yellow)} .rep{background:var(--pink)} .print{background:var(--green)}
.note{text-align:center;margin:13px 0;color:#566b82;font-weight:800}
.sheet{background:#fff;padding:12px;border-radius:18px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;grid-auto-rows:88mm}
.card{position:relative;min-width:0;background:var(--paper);border:2px dashed #8fc8ee;border-radius:14px;padding:8px;text-align:center;break-inside:avoid;page-break-inside:avoid;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.card:nth-child(3n+2){background:#f8fdff}.card:nth-child(3n){background:#fff9fc}.card:nth-child(3n+1){background:#f9fff8}
.no{font-size:12px;font-weight:900;color:#7d8ea0;line-height:1;margin:0 0 3px}
.poke-img,.img-fallback{display:block;width:78%;height:38mm;object-fit:contain;margin:1px auto;flex:0 0 auto}
.img-fallback{display:none;align-items:center;justify-content:center;background:#f5f7fa;border-radius:10px;color:#8a98a8;font-size:13px;font-weight:800}
.name{font-size:20px;font-weight:900;line-height:1.1;margin:2px 0 5px;white-space:nowrap}
.chips{display:flex;justify-content:center;align-items:flex-start;flex-wrap:wrap;gap:2mm;width:100%;min-height:20mm}
.chips.five,.chips.six{flex-wrap:nowrap;gap:1mm}
.chip{background:#fff;border:0.65mm solid var(--blue);border-radius:2.5mm;width:13mm;height:20mm;display:inline-flex;align-items:center;justify-content:center;font-size:0;font-weight:900;white-space:nowrap;flex:0 0 auto}
.chips.five .chip{width:10.2mm;height:20mm}
.chips.six .chip{width:8.8mm;height:20mm}
.badge{position:absolute;right:5px;top:5px;width:10mm;height:10mm;border-radius:50%;background:#e6455d;color:#fff;display:grid;place-items:center;font-size:15pt;font-weight:1000;line-height:1;z-index:2}
.mode{grid-column:1/-1;text-align:center;background:#fff4c8;border:2px solid #f0d66e;border-radius:13px;padding:9px;font-weight:900;break-inside:avoid}
.mode small{display:block;font-weight:700;color:#7c6a2a;margin-top:2px}
.footer{text-align:center;color:#7b8b9a;font-size:13px;margin:16px}

  .grid:not(.rep-mode) .chip{width:12mm!important;height:22mm!important;min-width:12mm!important;min-height:22mm!important;border:.65mm solid #a9dafa!important;border-radius:2.5mm!important;background:#fff!important;font-size:0!important;flex:0 0 auto!important}
  .grid:not(.rep-mode) .chips.five .chip{width:10.2mm!important;min-width:10.2mm!important}
  .grid:not(.rep-mode) .chips.six .chip{width:8.8mm!important;min-width:8.8mm!important}
  .grid:not(.rep-mode) .badge{width:9mm!important;height:9mm!important;font-size:14pt!important;right:1.5mm!important;top:1.5mm!important}

function pad3(n){return String(n).padStart(3,"0")}
function imgUrl(n){return `https://assets.pokemon.com/assets/cms2/img/pokedex/full/${pad3(n)}.png`}

function getZhuyin(name){
  // 每一個空白分隔的項目 = 一個中文字的完整注音。
  // 例如：妙蛙種子 → ㄇㄧㄠˋ / ㄨㄚ / ㄓㄨㄥˇ / ㄗ˙
  return ZHUYIN[name] || Array.from(name).map(()=> "•").join(" ");
}

function makeChips(name){
  // 練習版：注音答案完全隱藏，只留下空白格讓孩子自己書寫。
  // 格數依寶可夢名稱的注音音節數量；若沒有資料則依文字數量。
  const count = ZHUYIN[name] ? ZHUYIN[name].trim().split(/\s+/).length : Array.from(name).length;
  const cls = count === 5 ? "chips five" : (count === 6 ? "chips six" : "chips");
  return `<span class="${cls}">${Array.from({length: count}, ()=>`<span class="chip blank-chip">&nbsp;</span>`).join("")}</span>`;
}

function makeCard(id,name,badge=""){
  return `<article class="card">
    ${badge?`<div class="badge">${badge}</div>`:""}
    <div class="no">No.${pad3(id)}</div>
    <img class="poke-img" src="${imgUrl(id)}" alt="${name}"
      onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div class="img-fallback">🖼️ 圖片未載入<br>No.${pad3(id)}</div>
    <div class="name">${name}</div>
    ${makeChips(name)}
  </article>`;
}

function renderCards(cards, modeText=""){
  const grid = document.getElementById("grid");
  grid.classList.toggle("rep-mode", !!modeText);
  const mode = modeText ? `<div class="mode">${modeText}<small>右上角紅色圓章就是要練習的注音</small></div>` : "";
  grid.innerHTML = mode + cards.join("");
}

function random9(){
  let max=Number(document.getElementById("maxNo").value)||200;
  max=Math.max(9,Math.min(1025,max, NAMES.length));
  document.getElementById("maxNo").value=max;
  const a=Array.from({length:max},(_,i)=>i+1);
  for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  const ids=a.slice(0,9);
  renderCards(ids.map(id=>makeCard(id,NAMES[id-1])));
  document.getElementById("status").textContent=`🎲 已產生 No.1～No.${max} 中的不重複 9 隻；現在可以直接列印。`;
}

function all37(){
  renderCards(REPRESENTATIVES.map(x=>makeCard(x.id,x.name,x.symbol)), "⭐ 37 音代表寶可夢全覽");

// 載入完整的 1～1025 繁體中文名稱資料。
// 網頁版透過 HTTPS 讀取公開 JSON；若網路暫時失敗，會保留內建的前 500 筆資料。
async function loadFullNames(){
  const status=document.getElementById("status");
  try{
    status.textContent="⏳ 正在載入完整寶可夢名稱資料（No.001～No.1025）…";
    const r=await fetch("https://raw.githubusercontent.com/sindresorhus/pokemon/main/data/zh-hant.json",{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const full=await r.json();
    if(Array.isArray(full) && full.length>=1025){
      NAMES.splice(0,NAMES.length,...full.slice(0,1025));
      document.getElementById("maxNo").max="1025";
      status.textContent="✅ 已載入 1～1025 號寶可夢；現在可隨機抽 9 隻。";
      return true;
    }
    throw new Error("資料筆數不足");
  }catch(e){
    document.getElementById("maxNo").max=String(NAMES.length);
    status.textContent=`⚠️ 完整名稱資料暫時無法載入，目前可抽 No.001～No.${NAMES.length}。請確認網路後重新整理。`;
    return false;
  }
}
